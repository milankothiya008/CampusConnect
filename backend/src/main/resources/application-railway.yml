# Railway (API, MongoDB, Redis and RabbitMQ) with the web app on Vercel — docs/DEPLOY_RAILWAY_VERCEL.md.
# Active together with prod: SPRING_PROFILES_ACTIVE=prod,railway. Unlike the Docker Compose deployment there is
# no Nginx in front of the API: Railway's edge proxy reaches it directly (the live-chat WebSocket connects here),
# and the web app's /api calls arrive through Vercel's rewrite.

management:
  endpoints:
    web:
      exposure:
        # Only the health check is public: no proxy here keeps the metrics endpoint private.
        include: health

server:
  tomcat:
    remoteip:
      # The visitor's address comes first in X-Forwarded-For (Vercel sets it; Railway's edge adds its peer).
      # Every hop is trusted so that per-IP rate limits see visitors, not the proxies.
      trusted-proxies: ".*"

app:
  # Vercel's rewrite forwards the visitor's address in X-Vercel-Forwarded-For; Railway's edge replaces
  # X-Forwarded-For with Vercel's own (core.web.ClientIpFilter).
  client-ip-header: ${CLIENT_IP_HEADER:X-Vercel-Forwarded-For}
  realtime:
    # One API instance: the in-process STOMP broker. Before adding replicas, run RabbitMQ with the STOMP plugin
    # and set REALTIME_BROKER=relay.
    broker: ${REALTIME_BROKER:simple}
  mongo:
    # One small instance: fewer pooled connections.
    max-pool-size: ${MONGO_MAX_POOL_SIZE:20}
    min-pool-size: ${MONGO_MIN_POOL_SIZE:2}
