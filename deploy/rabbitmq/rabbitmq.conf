# CampusConnect: job queues (AMQP) and the STOMP relay for live chat.
stomp.listeners.tcp.1 = 61613
# Plenty of room for one relay connection per chat tab.
stomp.tcp_listen_options.backlog = 4096
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB
# Consumers that hold a message longer than this are presumed stuck (the e-mail throttle waits seconds, not hours).
consumer_timeout = 1800000
