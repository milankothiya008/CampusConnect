global:
  scrape_interval: 15s

scrape_configs:
  # Every API replica (Docker DNS returns one address per replica).
  - job_name: campusconnect-api
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8080
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
