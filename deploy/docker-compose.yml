# CampusConnect on one VPS.
#
#   cp .env.example .env            # fill in the secrets
#   docker compose up -d --build    # web + 3 API replicas + Redis + RabbitMQ (MongoDB: Atlas via MONGODB_URI)
#   docker compose --profile local up -d --build        # ...plus a local MongoDB replica set
#   docker compose --profile monitoring up -d           # ...plus Prometheus and Grafana
#   docker compose up -d --scale api=5                  # more API replicas
name: campusconnect

services:
  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
      args:
        VITE_UNIVERSITY_DOMAIN: ${UNIVERSITY_DOMAIN:-ddu.ac.in}
    image: campusconnect/web:${TAG:-latest}
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    environment:
      SERVER_NAME: ${SERVER_NAME:-_}
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
      - /etc/nginx/conf.d
      - /etc/nginx/templates
      - /etc/nginx/generated
    logging: &logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  api:
    build:
      context: ../backend
    image: campusconnect/api:${TAG:-latest}
    env_file: ${ENV_FILE:-.env}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/campusconnect?replicaSet=rs0}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-campusconnect}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      REALTIME_BROKER: relay
      JOBS_MODE: rabbit
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    deploy:
      replicas: ${API_REPLICAS:-3}
      resources:
        limits:
          cpus: "${API_CPUS:-1.5}"
          memory: ${API_MEMORY:-1536M}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
        required: false
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:8.2-alpine
    # Cache, rate limits, locks, presence: every key has a TTL, so under memory pressure only expiring keys go.
    command: >
      redis-server --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy volatile-lru
      --save "" --appendonly no
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    logging: *logging

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-campusconnect}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-campusconnect.conf:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  # Local MongoDB (single-node replica set, so transactions work). Production uses MongoDB Atlas instead.
  mongo:
    profiles: [local]
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging: *logging

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:12.1.0
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  uploads:
  rabbitmq-data:
  mongo-data:
  certbot-www:
  prometheus-data:
  grafana-data:
