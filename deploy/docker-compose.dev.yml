# Local development services, published on localhost only:
#
#   docker compose -f deploy/docker-compose.dev.yml up -d
#
# MongoDB 8 (single-node replica set rs0), Redis 8 and RabbitMQ 4 with the STOMP plugin. The API's "dev" profile
# needs only MongoDB and Redis (it uses the in-memory STOMP broker and runs jobs in-process); start RabbitMQ too and
# set REALTIME_BROKER=relay JOBS_MODE=rabbit to run exactly like production.
name: campusconnect-dev

services:
  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-dev:/data/db
    healthcheck:
      # Advertise localhost so the API on the host can follow the replica set member address.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:61613:61613"
    volumes:
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-campusconnect.conf:ro

volumes:
  mongo-dev:
