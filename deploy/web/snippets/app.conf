root /usr/share/nginx/html;

# The SPA's entry point and service worker must always be revalidated so a deploy reaches everyone.
location = /index.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/generated/security-headers.conf;
    include /etc/nginx/generated/hsts.conf;
}
location = /sw.js {
    add_header Cache-Control "no-cache";
    include /etc/nginx/generated/security-headers.conf;
}
# Vite fingerprints everything under /assets: cache for a year.
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/generated/security-headers.conf;
    try_files $uri =404;
}
location /icons/ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
}
location ~ /\. {
    deny all;
}

location /api/ {
    proxy_pass http://api;
    include /etc/nginx/snippets/proxy.conf;
}
# Locally stored uploads (when Cloudinary is not configured); file names are unique.
location /uploads/ {
    proxy_pass http://api;
    include /etc/nginx/snippets/proxy.conf;
}
# Live chat: STOMP over WebSocket. Long timeouts; STOMP heart-beats keep the connection alive.
location = /ws {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
}
# Metrics and health stay on the internal network (Prometheus scrapes the replicas directly).
location /actuator/ {
    return 404;
}

# Client-side routes.
location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/generated/security-headers.conf;
    include /etc/nginx/generated/hsts.conf;
}
