# Edge proxy for CampusConnect. Static assets are served here; API calls and WebSockets go to the API replicas.
user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    # Each open chat tab holds one WebSocket: room for many thousands of concurrent connections.
    worker_connections 16384;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types {
        application/manifest+json webmanifest;
        text/calendar ics;
    }

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    keepalive_requests 1000;
    # Slow-client protection.
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    # Gallery videos (local storage mode) are the largest uploads; production uploads go straight to Cloudinary.
    client_max_body_size 100m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/javascript text/css text/plain text/calendar image/svg+xml application/manifest+json;

    # Docker's DNS: `api` resolves to every replica; re-resolved every 10 s when replicas are added or removed.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream api {
        zone api 64k;
        least_conn;
        server api:8080 resolve max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent $request_time '
                    '"$http_referer" "$http_user_agent" upstream=$upstream_addr/$upstream_response_time';
    access_log /var/log/nginx/access.log main buffer=64k flush=5s;

    include /etc/nginx/conf.d/*.conf;
}
